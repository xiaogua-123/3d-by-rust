name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo build --release

      - name: 打包 Windows 发布包
        shell: bash
        run: |
          mkdir -p release/ni
          cp target/release/ni.exe release/ni/
          cp -r assets release/ni/
          cd release
          7z a "../ni-windows.zip" ni

      - uses: actions/upload-artifact@v4
        with:
          name: ni-windows
          path: ni-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo build --release

      - name: 打包 macOS 发布包
        run: |
          mkdir -p release/ni
          cp target/release/ni release/ni/
          cp -r assets release/ni/
          cd release
          zip -r ../ni-macos.zip ni

      - uses: actions/upload-artifact@v4
        with:
          name: ni-macos
          path: ni-macos.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ni-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ni-windows.zip
            ni-macos.zip
          generate_release_notes: true
